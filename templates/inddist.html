<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a City</title>
    <style>
        /* Background with Tamil Nadu cityscape image */
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: url("{{ url_for('static', filename='assests/serachbyd.jpeg') }}") no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-attachment: fixed;
        }

        /* Transparent overlay for readability */
        .overlay {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #0277bd;
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 10px;
            border: 2px solid #81d4fa;
            outline: none;
            margin-bottom: 20px;
            background: #ffffff;
            transition: 0.3s;
        }

        select:focus {
            border-color: #0288d1;
            box-shadow: 0 0 8px rgba(2, 136, 209, 0.5);
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #4fc3f7, #0288d1);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: linear-gradient(135deg, #0288d1, #01579b);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="overlay">
        <h1>Select a City</h1>
        <form method="POST" action="/bydist">
            <select name="city">
                <option value="VELLORE">VELLORE</option>
                <option value="COIMBATORE">COIMBATORE</option>
                <option value="DHARMAPURI">DHARMAPURI</option>
                <option value="KRISHNAGIRI">KRISHNAGIRI</option>
                <option value="SALEM">SALEM</option>
                <option value="ERODE">ERODE</option>
                <option value="THANJAVUR">THANJAVUR</option>
                <option value="TRICHY">TRICHY</option>
                <option value="TIRUNELVELI">TIRUNELVELI</option>
                <option value="THENI">THENI</option>
                <option value="SIVAGANGAI">SIVAGANGAI</option>
                <option value="MADURAI">MADURAI</option>
                <option value="VILLUPURAM">VILLUPURAM</option>
                <option value="THIRUVANNAMALAI">THIRUVANNAMALAI</option>
                <option value="KANCHEEPURAM">KANCHEEPURAM</option>
                <option value="TIRUCHIRAPPALLI">TIRUCHIRAPPALLI</option>
                <option value="ARIYALUR">ARIYALUR</option>
                <option value="NAGAPPATTINAM">NAGAPPATTINAM</option>
                <option value="CUDDALORE">CUDDALORE</option>
                <option value="KANYAKUMARI">KANYAKUMARI</option>
                <option value="RAMANATHAPURAM">RAMANATHAPURAM</option>
                <option value="DINDIGUL">DINDIGUL</option>
                <option value="THOOTHUKUDI">THOOTHUKUDI</option>
                <option value="CHENNAI">CHENNAI</option>
                <option value="CHENGALPATTU">CHENGALPATTU</option>
            </select>
            <br>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
